[package]
name = "bang-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bang mail engine: IMAP/SMTP, OAuth2, sync, and SQLite store. No UI dependencies."

[dependencies]
libc = "0.2"
md-5 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico", "webp"] }
bitflags = { version = "2.13.2", features = ["serde"] }
chrono = "0.4.45"
directories = "6.0.0"
dom_query = "0.29.0"
imap = "2.4.1"
imap-proto = "0.10.2"
lettre = { version = "0.11.23", features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }
mail-parser = "1.0.0"
native-tls = "0.2.18"
oauth2 = "5.0.0"
quick-xml = "0.42"
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
percent-encoding = "2.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1.44"
url = "2.5.8"
webbrowser = "1.2.6"

[features]
# Enables the IMAP integration tests (in-process test server).
integration = []

[dev-dependencies]
tokio = { version = "1.54.1", features = ["sync"] }
