[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bang desktop mail client UI (Slint) and tokio/Slint bridge."

[dependencies]
anyhow = "1.0.104"
bang-core = { path = "../bang-core" }
chrono = "0.4.45"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "image-default-formats", "compat-1-18"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
slint-build = "1.18.1"
