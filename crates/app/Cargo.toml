[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bang desktop mail client UI (Slint) and tokio/Slint bridge."
default-run = "app"

[features]
preview-renderer = ["dep:i-slint-backend-testing"]

[dependencies]
libc = "0.2"
dom_query = "0.29"
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
soup = { package = "soup3", version = "0.5" }
url = "2.5"
percent-encoding = "2.3"
webbrowser = "1.2"

i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"], optional = true }
anyhow = "1.0.104"
bang-core = { path = "../bang-core" }
chrono = "0.4.45"
directories = "6.0.0"
bang-composer = { path = "../composer", default-features = false }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "image-default-formats", "compat-1-18"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
futures-util = "0.3"
atspi = { version = "0.29.0", default-features = false, features = ["proxies", "zbus"] }
atspi-common = { version = "0.13.0", default-features = false, features = ["zbus"] }

[build-dependencies]
slint-build = "1.18.1"
serde_json = "1.0"

[dev-dependencies]
javascriptcore = { package = "javascriptcore-rs", version = "1.1", features = ["v2_28"] }
