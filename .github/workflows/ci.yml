name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          # GNOME Keyring is a test fixture for test-keyring.sh, not a Bang runtime dependency.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev pkg-config gnome-keyring dbus-x11 xvfb
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/composer/web/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: npm ci --prefix crates/composer/web
      - run: npm test --prefix crates/composer/web
      - run: npm run build --prefix crates/composer/web
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked --features app/preview-renderer,bang-core/integration -j2
      - run: bash scripts/test-keyring.sh
      - name: Deterministic screenshots
        run: |
          mkdir -p /tmp/bang-screenshots
          for theme in light dark; do
            BANG_SNAPSHOT="/tmp/bang-screenshots/inbox-$theme.png" BANG_WIDTH=1440 BANG_HEIGHT=900 BANG_LANGUAGE=en BANG_THEME="$theme" \
              cargo run -p app --locked --features preview-renderer -- --preview
          done
      - name: Packaging self-checks
        run: |
          bash -n scripts/package.sh scripts/package-container.sh scripts/test-keyring.sh
          python3 scripts/test-packaging.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: /tmp/bang-screenshots/*.png
          if-no-files-found: error
  packages:
    uses: ./.github/workflows/packages.yml
  required:
    name: Required checks
    if: always()
    needs: [tests, packages]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every test and package job
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          PACKAGE_RESULT: ${{ needs.packages.result }}
        run: test "$TEST_RESULT" = success && test "$PACKAGE_RESULT" = success
