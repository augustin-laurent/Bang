name: Packages
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build (defaults to the caller commit)
        required: false
        type: string
      require-google:
        description: Require the Google Desktop parameter for this build
        required: false
        default: false
        type: boolean
    secrets:
      BANG_GOOGLE_DESKTOP_PARAMETER:
        description: Google Desktop OAuth parameter
        required: false
permissions:
  contents: read
jobs:
  package:
    name: Package (${{ matrix.format }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: ubuntu:26.04
          - format: rpm
            image: fedora:45
          - format: arch
            image: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Build, install, upgrade, smoke test and uninstall
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
          PACKAGE_IMAGE: ${{ matrix.image }}
          REQUIRE_GOOGLE: ${{ inputs.require-google }}
          BANG_GOOGLE_DESKTOP_PARAMETER: ${{ secrets.BANG_GOOGLE_DESKTOP_PARAMETER }}
        run: |
          if [[ "$REQUIRE_GOOGLE" == true && -z "$BANG_GOOGLE_DESKTOP_PARAMETER" ]]; then
            echo 'Google Desktop OAuth parameter is required for this build.' >&2
            exit 1
          fi
          docker run --rm --init \
            -e BANG_PACKAGE_CONTAINER=1 -e CARGO_INCREMENTAL=0 \
            -e BANG_GOOGLE_DESKTOP_PARAMETER \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "$PACKAGE_IMAGE" bash scripts/package-container.sh "$PACKAGE_FORMAT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bang-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error
