name: Draft prerelease
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the merged main commit to release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: draft-prerelease
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate commit and prepare source recipe
        id: prepare
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
          BANG_GOOGLE_DESKTOP_PARAMETER: ${{ secrets.BANG_GOOGLE_DESKTOP_PARAMETER }}
        run: |
          if [[ -z "$BANG_GOOGLE_DESKTOP_PARAMETER" ]]; then
            echo 'Configure the BANG_GOOGLE_DESKTOP_PARAMETER repository secret before building a release.' >&2
            exit 1
          fi
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          # Require successful CI on the exact main commit, not only on its PR.
          gh run list --commit "$RELEASE_COMMIT" --workflow ci.yml --event push --json conclusion \
            --jq 'map(select(.conclusion == "success")) | length > 0' | grep -qx true
          git checkout --detach "$RELEASE_COMMIT"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          git archive --format=tar --prefix="Bang-$version/" "$RELEASE_COMMIT" | gzip -n > "dist/Bang-$version.tar.gz"
          source_sha=$(sha256sum "dist/Bang-$version.tar.gz" | cut -d' ' -f1)
          sed "s/@SOURCE_SHA256@/$source_sha/" packaging/arch/PKGBUILD > dist/PKGBUILD
          cp docs/RELEASE_NOTES_0.1.0.md dist/RELEASE_NOTES.md
          echo "sha=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bang-source
          path: dist/*
          if-no-files-found: error
  packages:
    needs: prepare
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets:
      BANG_GOOGLE_DESKTOP_PARAMETER: ${{ secrets.BANG_GOOGLE_DESKTOP_PARAMETER }}
  draft:
    needs: [prepare, packages]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bang-*
          merge-multiple: true
          path: dist
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash scripts/check-release-tag.sh "$RELEASE_SHA" "v$RELEASE_VERSION"
          cd dist
          sha256sum -- *.deb *.rpm *.pkg.tar.zst *.tar.gz PKGBUILD > SHA256SUMS
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --json isDraft > /tmp/bang-release.json 2>/tmp/bang-release-error; then
            python3 -c 'import json; assert json.load(open("/tmp/bang-release.json"))["isDraft"], "Refusing to modify a published release"'
            gh release edit "$tag" --draft --prerelease --target "$RELEASE_SHA" --notes-file RELEASE_NOTES.md
          else
            grep -qi 'release not found' /tmp/bang-release-error
            gh release create "$tag" --draft --prerelease --target "$RELEASE_SHA" \
              --title "Bang $tag — Linux preview" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" --clobber -- *.deb *.rpm *.pkg.tar.zst *.tar.gz PKGBUILD SHA256SUMS
